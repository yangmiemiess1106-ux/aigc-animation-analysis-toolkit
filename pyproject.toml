[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aigc-animation-analysis-toolkit"
version = "0.1.0"
description = "A transparent CSV toolkit for coding generative-AI short animations."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
